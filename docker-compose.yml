
services:
  postgres:
    image: postgres:17
    container_name: flowops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowops_db
      POSTGRES_USER: flowops_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flowops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowops_user -d flowops_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  flowops_postgres_data:
